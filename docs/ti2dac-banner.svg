<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="ti2dac: Threat Intelligence to Detection-as-Code. Report to Sigma to Splunk, Elastic, Sentinel, Defender, CrowdStrike, QRadar, OpenSearch, Loki and Wazuh.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14264a"/>
      <stop offset="1" stop-color="#1f4e79"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="#17325a"/>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- logo mark -->
  <rect x="90" y="84" width="96" height="96" rx="22" fill="#12805c"/>
  <text x="138" y="152" text-anchor="middle" font-size="62" font-weight="700" fill="#ffffff">Σ</text>
  <!-- title -->
  <text x="222" y="150" font-size="86" font-weight="700" fill="#ffffff" letter-spacing="1">ti2dac</text>
  <text x="224" y="190" font-size="26" fill="#cfe0f5">Threat Intelligence → Detection-as-Code</text>
  <!-- pipeline strip -->
  <g font-size="17" fill="#ffffff">
    <rect x="90" y="226" width="150" height="40" rx="20" fill="#9b1c31"/>
    <text x="165" y="252" text-anchor="middle">TI report</text>
    <text x="258" y="253" font-size="22" fill="#9fb8d6">→</text>
    <rect x="288" y="226" width="130" height="40" rx="20" fill="#9b1c31"/>
    <text x="353" y="252" text-anchor="middle">Sigma rule</text>
    <text x="436" y="253" font-size="22" fill="#9fb8d6">→</text>
    <rect x="466" y="226" width="724" height="40" rx="20" fill="none" stroke="#9fb8d6" stroke-width="2"/>
    <text x="828" y="252" text-anchor="middle" fill="#e6effa">Splunk · Elastic · Sentinel · Defender · CrowdStrike · QRadar · OpenSearch · Loki · Wazuh</text>
  </g>
  <text x="1190" y="70" text-anchor="end" font-size="16" fill="#9fb8d6">open source · MIT</text>
</svg>
